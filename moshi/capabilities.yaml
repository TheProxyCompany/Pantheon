# Native PIE Moshi/Mimi/ARC backend; Orchard transports audio and reference updates.
modalities: [audio, text]
features: [duplex_audio, streaming, speech_conditioning]
architecture: moshi
backend: pie
context_length: 3000

audio:
  native: true
  duplex: true
  sample_rate: 24000
  channels: 1
  frame_samples: 1920
  input_codebooks: 8
  output_codebooks: 8
  format: pcm_f32le
  # Moshi text is its own speech, never a microphone transcript.
  text_source: assistant_speech

duplex:
  sample_rate: 24000
  frame_samples: 1920
  codebooks: 8
  architecture_version: v0_1
  model_file: model.q8.gguf
  codec_file: tokenizer-e351c8d8-checkpoint125.safetensors
  tokenizer_file: tokenizer_spm_32k_3.model
  checkpoints:
    kyutai/moshiko-candle-q8:
      revision: 21b4ad73214f2e52eaa11a11dd70b23c4c97ea7a
    kyutai/moshika-candle-q8:
      revision: 4b4a873fc1d3b92ce32b3ae91ff8e95bbb62193f
    kyutai/moshika-rag-candle-bf16:
      revision: 26c8294761455c0aaafbadc6772c890fdc11f68f
      model_file: model.safetensors
      mode: reference_conditioning
      acoustic_delay: 1
      reference_encoder:
        repo: kyutai/ARC4_Encoder_Llama
        revision: c11e53d1016cc586262ee883755410e2ca47ba3c
        filename: model.safetensors
      reference_tokenizer:
        repo: meta-llama/Llama-3.2-3B-Instruct
        revision: 0cb88a4f764b7a12671c53f0838cd831a0843b95
        filename: tokenizer.json
